<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>伍陆社区市场管理</title>
<link rel="stylesheet" href="/community/style.css"><script src="/community/app.js" defer></script></head>
<body><main><header><a href="/admin.html">返回管理员后台</a><h1>社区市场管理</h1><p>查看客户端投稿、审核作品、管理上架状态。普通用户在伍陆客户端中上传和管理自己的作品。</p></header>
<p id="notice" role="status"></p>
<section id="login"><h2>管理员登录</h2><form id="loginForm"><label>邮箱<input id="email" type="email" required autocomplete="username"></label><label>密码<input id="password" type="password" required autocomplete="current-password"></label><button>登录后台</button></form></section>
<section id="itemsSection" hidden><h2>投稿情况与审批</h2><button id="refresh" type="button">刷新列表</button><label>审核状态<select id="statusFilter"><option value="">全部</option><option value="pending">待审核</option><option value="approved">已通过</option><option value="rejected">已退回</option><option value="withdrawn">已下架</option></select></label><div id="items"></div><div><button id="previous">上一页</button><span id="pageLabel"></span><button id="next">下一页</button></div></section>
</main></body></html>
