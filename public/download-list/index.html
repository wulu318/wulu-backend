<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WULU SuperAgent - 下载</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0a;--card:#111;--border:#222;--gold:#FFD700;--gold-dim:#B8860B;--text:#e0e0e0;--text-dim:#888}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.7}
.container{max-width:700px;margin:0 auto;padding:60px 24px}
h1{color:var(--gold);font-size:32px;text-align:center;margin-bottom:8px;letter-spacing:2px}
.tagline{color:var(--text-dim);text-align:center;margin-bottom:8px;font-size:14px}
.version{color:var(--gold-dim);text-align:center;margin-bottom:40px;font-size:13px;letter-spacing:1px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.card .info h3{color:var(--gold);font-size:18px;margin-bottom:4px}
.card .info p{color:var(--text-dim);font-size:13px}
.card .btn{background:linear-gradient(135deg,var(--gold),var(--gold-dim));color:#000;padding:10px 24px;border-radius:8px;text-decoration:none;font-weight:700;font-size:14px;white-space:nowrap}
.card .btn:hover{opacity:.9}
.card .btn.coming{background:var(--border);color:var(--text-dim);cursor:not-allowed}
.card .size{color:var(--text-dim);font-size:12px;margin-left:8px;font-weight:400}
.footer{text-align:center;color:var(--text-dim);font-size:12px;margin-top:48px}
a{color:var(--gold)}
.notice{background:#1a1200;border:1px solid #3a2e00;color:#d9c26b;border-radius:8px;padding:12px 16px;font-size:13px;margin-bottom:24px;display:none}
@media(max-width:520px){.card{flex-direction:column;align-items:flex-start}.card .btn{width:100%;text-align:center}}
</style>
</head>
<body>
<div class="container">
<h1>WULU SuperAgent</h1>
<p class="tagline">下载最新版本</p>
<p class="version" id="version">&nbsp;</p>

<div class="notice" id="notice"></div>
<div id="cards"></div>

<div class="footer" id="footer"></div>
</div>

<script>
(function () {
  var PLATFORMS = [
    { key: 'windowsX64', name: 'Windows x64', desc: 'Windows 10/11 64 位' },
    { key: 'windowsArm64', name: 'Windows ARM64', desc: '骁龙等 ARM 芯片 PC' },
    { key: 'macArm', name: 'macOS Apple Silicon', desc: 'MacBook M1/M2/M3/M4' },
    { key: 'macIntel', name: 'macOS Intel', desc: 'Intel 芯片 Mac' },
    { key: 'linuxX64', name: 'Linux x64', desc: 'Ubuntu / Debian / Fedora' },
    { key: 'linuxArm64', name: 'Linux ARM64', desc: 'UOS / 麒麟 / openEuler' }
  ];

  function formatSize(bytes) {
    if (!bytes || bytes <= 0) return '';
    var mb = bytes / (1024 * 1024);
    return mb >= 1024 ? (mb / 1024).toFixed(1) + ' GB' : Math.round(mb) + ' MB';
  }

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }

  function render(data) {
    var versionEl = document.getElementById('version');
    versionEl.textContent = data.version ? ('版本 ' + data.version + (data.date ? ' · ' + data.date : '')) : '暂无发布版本';

    var cards = document.getElementById('cards');
    var html = '';
    var missing = 0;

    PLATFORMS.forEach(function (item) {
      var platform = (data.platforms || {})[item.key] || { available: false };
      var size = platform.available ? formatSize(platform.size) : '';

      if (platform.available) {
        html += '<div class="card"><div class="info"><h3>' + escapeHtml(item.name) + '</h3>' +
          '<p>' + escapeHtml(item.desc) + (size ? ' · ' + size : '') + '</p></div>' +
          '<a class="btn" href="' + escapeHtml(platform.url) + '" rel="noopener">下载</a></div>';
      } else {
        missing += 1;
        html += '<div class="card"><div class="info"><h3>' + escapeHtml(item.name) + '</h3>' +
          '<p>当前版本未提供此平台安装包</p></div>' +
          '<span class="btn coming">暂无</span></div>';
      }
    });

    cards.innerHTML = html;

    if (missing > 0) {
      var notice = document.getElementById('notice');
      notice.style.display = 'block';
      notice.textContent = '有 ' + missing + ' 个平台在当前版本中没有安装包，已置灰。可查看历史版本：' +
        ((data.contact && data.contact.releasesUrl) || '');
    }

    var footer = document.getElementById('footer');
    var parts = ['WULU SuperAgent · All Rights Reserved.'];
    if (data.contact && data.contact.email) {
      parts.push('<a href="mailto:' + escapeHtml(data.contact.email) + '">' + escapeHtml(data.contact.email) + '</a>');
    }
    if (data.contact && data.contact.issuesUrl) {
      parts.push('<a href="' + escapeHtml(data.contact.issuesUrl) + '" rel="noopener">问题反馈</a>');
    }
    footer.innerHTML = parts.join(' · ');
  }

  fetch('/api/download/latest', { headers: { Accept: 'application/json' } })
    .then(function (res) { return res.json(); })
    .then(function (payload) {
      if (!payload || payload.code !== 0) throw new Error('bad payload');
      render(payload.data || {});
    })
    .catch(function () {
      document.getElementById('version').textContent = '无法加载版本信息';
      document.getElementById('footer').innerHTML =
        'WULU SuperAgent · <a href="https://github.com/wulu318/wulu-superagent/releases" rel="noopener">查看历史版本</a>';
    });
})();
</script>
</body>
</html>
